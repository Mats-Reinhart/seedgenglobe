plugins {
	// Minecraft 26.1 ships unobfuscated, so this is Loom's non-remapping plugin (no mappings line, plain implementation deps).
	id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Distant Horizons, Big Globe, Xaero's World Map and Minimap and Vertigo are compiled against local jars in libs/
// (see libs/README.txt). Players install those mods themselves; nothing from them ends up in SeedGenGlobe's jar.
def localMods = fileTree('libs') { include '*.jar' }
// Big Globe keeps a library that its public classes refer to (autocodec) inside its own jar, and Xaero's mods keep theirs (xaerolib).
def nestedLibraries = files(provider {
	localMods.files.collectMany { jar ->
		zipTree(jar).matching {
			include 'META-INF/jars/*.jar'
			exclude 'META-INF/jars/fabric-*' // Fabric API modules bundled by Distant Horizons; fabric-api below provides them
		}.files
	}
})

sourceSets {
	main {
		// compile-time copy of Vertigo's small public API, so Vertigo itself is optional for building (excluded from the jar)
		java.srcDir 'src/vertigoStubs/java'
	}
	// the logic tests of ColumnProfile, XaeroPixel, the structure capture view and the LOD map regions run without
	// Minecraft, against small fakes of the classes they use
	columnTest {
		java.srcDir 'src/testFakes/java'
		java.srcDir layout.buildDirectory.dir('generated/columnTest')
	}
}

def copyColumnProfile = tasks.register('copyColumnProfileForTest', Copy) {
	from('src/main/java') {
		include 'dev/seedgenglobe/terrain/ColumnProfile.java'
		include 'dev/seedgenglobe/terrain/SampledColumns.java'
		include 'dev/seedgenglobe/structures/SampleGrid.java'
		include 'dev/seedgenglobe/structures/CaptureView.java'
		include 'dev/seedgenglobe/xaero/MapPixel.java'
		include 'dev/seedgenglobe/xaero/XaeroPixel.java'
		include 'dev/seedgenglobe/xaero/MapSection.java'
		include 'dev/seedgenglobe/xaero/LodRegion.java'
		include 'dev/seedgenglobe/xaero/RegionCanvas.java'
	}
	into layout.buildDirectory.dir('generated/columnTest')
}
tasks.named('compileColumnTestJava') { dependsOn copyColumnProfile }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	compileOnly localMods
	compileOnly nestedLibraries
	compileOnly 'org.jetbrains:annotations:26.0.2'

	testCompileOnly localMods
	testRuntimeOnly localMods
	testRuntimeOnly nestedLibraries

	columnTestCompileOnly 'org.jetbrains:annotations:26.0.2'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

jar {
	exclude 'builderb0y/**' // the Vertigo API stubs
	from('LICENSE') {
		rename { "${it}_${project.archives_base_name}" }
	}
}

sourcesJar {
	exclude 'builderb0y/**'
}

def columnProfileTest = tasks.register('columnProfileTest', JavaExec) {
	group = 'verification'
	description = 'Checks ColumnProfile against the data point rules of Distant Horizons and the light model of Big Globe.'
	classpath = sourceSets.columnTest.runtimeClasspath
	mainClass = 'dev.seedgenglobe.terrain.ColumnProfileTest'
}

def xaeroPixelTest = tasks.register('xaeroPixelTest', JavaExec) {
	group = 'verification'
	description = 'Checks that a column reads on the LOD map the way Xaero\'s World Map reads a chunk column.'
	classpath = sourceSets.columnTest.runtimeClasspath
	mainClass = 'dev.seedgenglobe.xaero.XaeroPixelTest'
}

def captureViewTest = tasks.register('captureViewTest', JavaExec) {
	group = 'verification'
	description = 'Checks the section structures are placed into: sample points, kept writes, heightmaps and relit columns.'
	classpath = sourceSets.columnTest.runtimeClasspath
	mainClass = 'dev.seedgenglobe.structures.CaptureViewTest'
}

def lodCanvasTest = tasks.register('lodCanvasTest', JavaExec) {
	group = 'verification'
	description = 'Checks how LOD sections of every detail level are merged into LOD map regions, against a block-by-block model.'
	classpath = sourceSets.columnTest.runtimeClasspath
	mainClass = 'dev.seedgenglobe.xaero.LodCanvasTest'
}

def canopyMathTest = tasks.register('canopyMathTest', JavaExec) {
	group = 'verification'
	description = 'Sanity checks for the tree canopy shape functions.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.seedgenglobe.terrain.CanopyMathTest'
}

def groundCoverTest = tasks.register('groundCoverTest', JavaExec) {
	group = 'verification'
	description = 'Checks the ground cover decorators against Big Globe\'s chances and Distant Horizons\' 2 x 2 merge.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.seedgenglobe.terrain.GroundCoverTest'
}

def lodMapGeometryTest = tasks.register('lodMapGeometryTest', JavaExec) {
	group = 'verification'
	description = 'Checks the region rings, keys, distances, Distant Horizons\' detail levels and tile rules of the Xaero LOD map.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.seedgenglobe.xaero.LodMapGeometryTest'
}

tasks.named('check') {
	dependsOn columnProfileTest, xaeroPixelTest, captureViewTest, lodCanvasTest, canopyMathTest, groundCoverTest, lodMapGeometryTest
}
